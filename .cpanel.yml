---
deployment:
  tasks:
    - export DEPLOYPATH=${DEPLOYPATH:-$(pwd)}
    - /bin/cp -R dist/* $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp -R assets $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess 2>/dev/null || true
    - /bin/cp index.php $DEPLOYPATH/index.php 2>/dev/null || true
    - /bin/cp seedData.json $DEPLOYPATH/seedData.json 2>/dev/null || true
